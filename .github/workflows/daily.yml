name: daily-daf

on:
  schedule:
    - cron: "17 4 * * *"   # every day, ~05:17 Zurich (off the top of the hour = less queueing)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-daf
  cancel-in-progress: false

jobs:
  daf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update README + log
        id: daf
        run: echo "subject=$(python3 .github/scripts/daily_daf.py)" >> "$GITHUB_OUTPUT"

      - name: Commit as Christian Lehnert
        env:
          SUBJECT: ${{ steps.daf.outputs.subject }}
        run: |
          git config user.name  "Christian Lehnert"
          git config user.email "43512582+chfle@users.noreply.github.com"
          git add README.md DAF_LOG.md
          git diff --cached --quiet && { echo "nothing to commit"; exit 0; }
          git commit -m "$SUBJECT"
          for i in 1 2 3; do
            git pull --rebase --quiet && git push && exit 0
            sleep $((i * 10))
          done
          exit 1
